# ============================================================
# SECRET — хранит пароль от MongoDB
# Kubernetes шифрует его в base64
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: default
type: Opaque
data:
  # echo -n "admin" | base64  →  YWRtaW4=
  mongo-root-username: YWRtaW4=
  # echo -n "password123" | base64  →  cGFzc3dvcmQxMjM=
  mongo-root-password: cGFzc3dvcmQxMjM=

---
# ============================================================
# DEPLOYMENT — говорит k8s: запусти 1 копию MongoDB
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: default
spec:
  replicas: 1          # одна копия — нам хватит
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:6.0   # официальный образ MongoDB
          ports:
            - containerPort: 27017  # стандартный порт MongoDB
          env:
            # берём логин и пароль из Secret (не пишем открытым текстом!)
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: mongo-root-username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: mongo-root-password
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db   # сюда MongoDB сохраняет данные
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-pvc  # подключаем диск (см. ниже)

---
# ============================================================
# PVC — заказываем постоянный диск 5GB для данных MongoDB
# Без этого данные удалятся при перезапуске контейнера!
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce   # диск подключается к одному поду
  resources:
    requests:
      storage: 5Gi    # 5 гигабайт

---
# ============================================================
# SERVICE — открывает доступ к MongoDB внутри кластера
# Другие сервисы (backend) обращаются по имени: mongodb-service:27017
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: default
spec:
  selector:
    app: mongodb      # находит наш под по лейблу
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
  type: ClusterIP     # доступен только внутри кластера (не снаружи)
