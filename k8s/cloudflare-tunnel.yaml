# Cloudflare Tunnel конфигурация
# Задача #32 — публичный HTTPS доступ через Cloudflare Tunnel

tunnel: translation-notarization-tunnel
credentials-file: /etc/cloudflared/credentials.json

ingress:
  # Frontend — основной сайт
  - hostname: app.translation-service.com
    service: http://frontend:3001

  # Backend API
  - hostname: api.translation-service.com
    service: http://backend:3000

  # MinIO — файловое хранилище
  - hostname: storage.translation-service.com
    service: http://minio:9000

  # Все остальные запросы — 404
  - service: http_status:404
