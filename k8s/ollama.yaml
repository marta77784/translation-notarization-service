# k8s/ollama.yaml
# Ollama (LLM inference) for translation-worker.
# Model: qwen2.5:1.5b — ~400 MiB on disk, ~600-700 MiB at inference time on CPU.
# First boot pulls the model into PVC; subsequent restarts are instant (no-op pull).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: default
  labels:
    app: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate          # PVC is RWO — two pods cannot mount it simultaneously
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
              name: http
          # Start the server, wait for it, then pull the model and keep server in foreground.
          # `ollama pull` is idempotent: if the blob is already in /root/.ollama it returns instantly.
          command: ["/bin/sh", "-c"]
          args:
            - |
              ollama serve &
              SERVE_PID=$!
              # Wait for server to accept requests (max ~30s).
              for i in $(seq 1 30); do
                if ollama list >/dev/null 2>&1; then break; fi
                sleep 1
              done
              ollama pull qwen2.5:1.5b
              wait $SERVE_PID
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_KEEP_ALIVE
              value: "30m"
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30        # generous window for first-time model pull
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 120
            periodSeconds: 30
          resources:
            requests:
              cpu: "200m"
              memory: "1200Mi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: 11434