version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      MONGO_URL: mongodb://mongo:27017/translation
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecretkey_change_in_production
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_UPLOADS: uploads
      FRONTEND_URL: http://localhost:3000
      SERVICE_SECRET: internal_secret_change_in_production
    depends_on:
      - mongo
      - redis
      - minio

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  mongo_data:
  minio_data:
